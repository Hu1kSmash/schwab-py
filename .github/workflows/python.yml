name: tests

on:
  push:
  pull_request:
  # Lets CI be re-run on demand, without pushing an empty commit to provoke it.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every Python on every platform is fifteen jobs, and GitHub bills
        # Windows at twice the Linux rate and macOS at ten times it -- so a
        # single push costs about thirteen times what testing on Linux alone
        # does. That is hard to justify for every commit.
        #
        # Linux on every push, all three platforms on pull requests, on tags,
        # and on a manual run. The cross-platform risk in this library is
        # concentrated in the token file writer, which renames files and sets
        # permissions; that is worth proving before a merge or a release, not
        # before every commit.
        #
        # workflow_dispatch is in the full-matrix list deliberately. Without it
        # the on-demand run was Linux-only, so the one button available for
        # checking a cross-platform fix could not check one -- which is how
        # seven macOS failures sat red on every tag from v2.0.0 to v2.4.0
        # without anyone being able to test a fix short of cutting a release.
        platform: >-
          ${{
            (github.event_name == 'pull_request'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/tags/'))
            && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}
        python:
        - version: "3.10"
          toxenv: py310
        - version: "3.11"
          toxenv: py311
        - version: "3.12"
          toxenv: py312
        - version: "3.13"
          toxenv: py313
        - version: "3.14"
          toxenv: py314
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        pip install ".[dev]"

    - name: Test with tox ${{ matrix.python.toxenv }}
      env:
        TOXENV: ${{ matrix.python.toxenv }}
      run: tox

    - name: Report coverage
      if: matrix.python.version == '3.10'
      run: |
        coverage combine
        coverage report
        coverage xml

    - name: Check twine
      if: matrix.python.version == '3.10'
      run: |
        python3 setup.py sdist bdist_wheel
        twine check dist/*

  docs:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python:
        - version: "3.12"
          toxenv: py312
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install -r docs/requirements.txt

    - name: Verify that documentation builds
      run: |
        sphinx-build -W docs/ docs-build
