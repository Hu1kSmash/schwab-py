blank_issues_enabled: false
contact_links:
  - name: Is this actually a fork problem?
    url: https://github.com/alexgolec/schwab-py/issues
    about: >-
      This is a fork. If the problem is not caused by one of the changes in
      CHANGELOG.md, please report it upstream instead, where it will help more
      people.
  - name: Security vulnerability
    url: https://github.com/Hu1kSmash/schwab-py/security/advisories/new
    about: >-
      Do not open a public issue. This library holds brokerage credentials and
      can place trades; report privately.
  - name: Questions and discussion
    url: https://github.com/Hu1kSmash/schwab-py/discussions
    about: >-
      For "how do I", "is this supposed to", and anything you are not yet sure
      is a bug.
