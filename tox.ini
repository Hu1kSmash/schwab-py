[tox]
envlist =
    {py310,py311,py312,py313,py314}
    coverage

[testenv]
# tox filters the environment, so a variable the tests read has to be named
# here. CI is read by tests/auth_test.py to skip the login-flow cases on hosted
# macOS runners only -- without it the skip silently never fired and the macOS
# jobs stayed red, which is how it was found.
passenv =
    CI
setenv =
    TESTPATH=tests/
    RCFILE=setup.cfg
allowlist_externals=coverage
commands =
    coverage run --rcfile={env:RCFILE} --source=schwab -p -m pytest {env:TESTPATH}

[testenv:coverage]
skip_install = true
commands =
    coverage combine
    coverage report
    coverage html
