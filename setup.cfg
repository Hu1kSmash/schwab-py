[metadata]
license_file = LICENSE

[check-manifest]
ignore =
    tox.ini

[tool:pytest]
python_files = *test*.py
testpaths = tests
norecursedirs=schwab build dist docs htmlcov

[coverage:run]
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    except ImportError
    def __repr__
    raise NotImplementedError
    raise DeprecationWarning
    deprecate
